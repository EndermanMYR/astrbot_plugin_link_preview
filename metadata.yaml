name: astrbot_plugin_link_preview
display_name: 外链预览
short_desc: 群里发链接自动抓取内容画成卡片图片发回，支持 19 个国外平台、9 个国内视频平台和任意网页
desc: 自动识别群聊里的 YouTube、TikTok、Instagram、X、GitHub、Reddit、Bluesky、pixiv、Steam、维基百科、维基文库、Dailymotion、niconico、Spotify 等国外平台链接，抓取标题、作者、正文、配图、数据和热门评论，画成卡片图片发回群里；其他网站也会按页面 OpenGraph 出卡；国内视频平台（B 站含 b23.tv 短链、抖音、快手、西瓜视频、腾讯视频、优酷、爱奇艺、微博、小红书）支持卡片和 /下载视频 下载；/评论 指令可单独查看评论，/全文 指令把维基百科词条、维基文库作品全文分页后合并转发。
version: 3.0.0
author: ネコの先生
repo: https://github.com/EndermanMYR/astrbot_plugin_link_preview
astrbot_version: ">=4.16,<5"
