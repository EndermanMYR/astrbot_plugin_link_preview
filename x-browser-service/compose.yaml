services:
  xbrowser:
    # 默认用 GitHub Actions 构建好的镜像，省掉本地 10 分钟的 chromium + pip 安装；
    # 拉不到（没网、镜像还没发布）会自动退回本地构建，所以没有 Docker Hub 账号也能用
    image: ${XBROWSER_IMAGE:-ghcr.io/endermanmyr/astrbot-xbrowser:latest}
    build:
      context: .
      args:
        # 国内构建慢/卡住时，在 .env 里设 PIP_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX: ${PIP_INDEX:-}
    restart: unless-stopped
    init: true
    user: "${LOGIN_UID:-1000}:${LOGIN_GID:-1000}"
    # Chromium 用 --disable-dev-shm-usage，共享内存不需要很大
    shm_size: 256mb
    environment:
      X_LOGIN_SERVICE_TOKEN: ${X_LOGIN_SERVICE_TOKEN:?请在 .env 配置至少 32 字符的 Token}
      X_COOKIE_FILE: /cookies/x_cookies.json
      # 空闲多久关掉浏览器。调大能减少冷启动（冷启动要多花 8~10 秒），代价是常驻内存
      X_SCRAPER_IDLE: ${X_SCRAPER_IDLE:-1800}
    volumes:
      - ${ASTRBOT_COOKIE_DIR:?请在 .env 配置 Cookie 目录的绝对路径}:/cookies
    networks:
      - xlogin
networks:
  # 键名不能以 x- 开头：Compose 会把 x-* 当扩展字段忽略
  xlogin:
    name: astrbot-x-login
