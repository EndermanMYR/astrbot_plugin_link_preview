services:
  xbrowser:
    # 默认本地构建，不联网拉镜像：装一次 chromium 之后层都缓存在本机，
    # 改 scraper.py 时重建只要几秒。想省掉第一次那 10 分钟，见下面注释。
    image: ${XBROWSER_IMAGE:-astrbot-xbrowser:latest}
    build:
      context: .
      args:
        # 国内构建卡在 PyPI 时，在 .env 里设 PIP_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX: ${PIP_INDEX:-}
    # 想用 GitHub Actions 预构建好的镜像（不本地构建）：
    #   在 .env 里加 XBROWSER_IMAGE=ghcr.io/endermanmyr/astrbot-xbrowser:latest
    #   然后 docker compose up -d
    # 注意 ghcr.io 在部分网络环境下不可达，连不上就保持默认的本地构建
    restart: unless-stopped
    # 不再加 init: true —— 镜像的 ENTRYPOINT 已经是 tini，
    # 两层叠一起会报 "Tini is not running as PID 1"
    user: "${LOGIN_UID:-1000}:${LOGIN_GID:-1000}"
    # Chromium 用 --disable-dev-shm-usage，共享内存不需要很大
    shm_size: 256mb
    environment:
      X_LOGIN_SERVICE_TOKEN: ${X_LOGIN_SERVICE_TOKEN:?请在 .env 配置至少 32 字符的 Token}
      X_COOKIE_FILE: /cookies/x_cookies.json
      # 空闲多久关掉浏览器。调大能减少冷启动（冷启动要多花 8~10 秒），代价是常驻内存
      X_SCRAPER_IDLE: ${X_SCRAPER_IDLE:-1800}
    volumes:
      - ${ASTRBOT_COOKIE_DIR:?请在 .env 配置 Cookie 目录的绝对路径}:/cookies
    networks:
      - xlogin
networks:
  # 键名不能以 x- 开头：Compose 会把 x-* 当扩展字段忽略
  xlogin:
    name: astrbot-x-login
