services:
  xbrowser:
    build: .
    image: astrbot-xbrowser:latest
    restart: unless-stopped
    init: true
    user: "${LOGIN_UID:-1000}:${LOGIN_GID:-1000}"
    # Chromium 用 --disable-dev-shm-usage，共享内存不需要很大
    shm_size: 256mb
    environment:
      X_LOGIN_SERVICE_TOKEN: ${X_LOGIN_SERVICE_TOKEN:?请在 .env 配置至少 32 字符的 Token}
      X_COOKIE_FILE: /cookies/x_cookies.json
      # 空闲这么久没有请求就关掉浏览器，把内存还给系统
      X_SCRAPER_IDLE: ${X_SCRAPER_IDLE:-300}
    volumes:
      - ${ASTRBOT_COOKIE_DIR:?请在 .env 配置 Cookie 目录的绝对路径}:/cookies
    networks:
      - xlogin
networks:
  # 键名不能以 x- 开头：Compose 会把 x-* 当扩展字段忽略
  xlogin:
    name: astrbot-x-login
